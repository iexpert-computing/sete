<div class="container-fluid">
    <div class="row justify-content-center mb-2">
        <i class="fa fa-file-zip-o" id="pageIcon" aria-hidden="true"></i>
        <p class="pageTitle">Importar do MOBI</p>
    </div>

    <div class="row">
        <div class="col-md-10 ml-auto mr-auto">
            <div class="card">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-8">
                            <div class="form-group">
                                <label><b>Arquivo exportado pelo MOBI</b></label>
                                <input id="mobiImportFile" type="file" accept=".zip,.json,application/zip,application/json" class="form-control">
                            </div>
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button id="mobiImportButton" class="btn btn-fill btn-warning btn-block" disabled>
                                Importar arquivo
                            </button>
                        </div>
                    </div>

                    <div id="mobiImportPreview" class="mt-3"></div>
                    <div id="mobiImportWarnings" class="mt-3"></div>
                    <div id="mobiImportResult" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="./modules/mobi/mobi-importar-ctrl.js" type="text/javascript"></script>
